name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: raidnow-lite:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name raidnow-lite-ci -p 4173:4173 raidnow-lite:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs raidnow-lite-ci
          exit 1
